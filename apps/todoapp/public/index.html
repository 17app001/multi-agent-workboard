<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Todo App</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background: #f7f7f5; color: #222; }
  h1 { font-size: 22px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] { flex: 1; padding: 8px 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 14px; font-size: 15px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px; background: #fff; border-radius: 8px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  li.done span.text { text-decoration: line-through; color: #999; }
  li span.text { flex: 1; word-break: break-all; }
  li button.del { background: #dc2626; }
  li button.del:hover { background: #b91c1c; }
  .empty { color: #888; text-align: center; padding: 20px; }
</style>
</head>
<body>
  <h1>Todo App</h1>
  <form id="add-form">
    <input type="text" id="new-text" placeholder="新增待辦事項..." autocomplete="off" required>
    <button type="submit">新增</button>
  </form>
  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>目前沒有待辦事項</p>

<script>
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const formEl = document.getElementById('add-form');
const inputEl = document.getElementById('new-text');

async function fetchTodos() {
  const res = await fetch('/api/todos');
  const todos = await res.json();
  render(todos);
}

function render(todos) {
  listEl.innerHTML = '';
  emptyEl.hidden = todos.length > 0;
  for (const t of todos) {
    const li = document.createElement('li');
    li.className = t.done ? 'done' : '';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = t.done;
    checkbox.addEventListener('change', () => toggleDone(t.id, checkbox.checked));
    const span = document.createElement('span');
    span.className = 'text';
    span.textContent = t.text;
    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.textContent = '刪除';
    delBtn.addEventListener('click', () => removeTodo(t.id));
    li.append(checkbox, span, delBtn);
    listEl.appendChild(li);
  }
}

async function addTodo(text) {
  await fetch('/api/todos', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) });
  await fetchTodos();
}

async function toggleDone(id, done) {
  await fetch('/api/todos/' + id, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ done }) });
  await fetchTodos();
}

async function removeTodo(id) {
  await fetch('/api/todos/' + id, { method: 'DELETE' });
  await fetchTodos();
}

formEl.addEventListener('submit', e => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addTodo(text);
});

fetchTodos();
</script>
</body>
</html>
