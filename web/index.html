<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Agent Workboard</title>
<style>
:root{--bg:#F7F1E8;--card:#FDFBF7;--fg:#3A332C;--mut:#8A8072;--line:#E8DFD1;--accent:#C97B4A;--accent-hover:#B5693B;--accent2:#6E9B93;--danger:#B5564A;--shadow:0 2px 8px rgba(60,50,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#2A241C;--card:#372F24;--fg:#F0E9DC;--mut:#B8AD9A;--line:#4A4030;--shadow:0 2px 10px rgba(0,0,0,.35)}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,"Segoe UI","Noto Sans TC",sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 14px;font-weight:600}h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px}
.usage{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:var(--shadow)}
.big{font-size:20px;font-weight:600}.mut{color:var(--mut);font-size:12px}
.bar{display:flex;gap:2px;align-items:flex-end;height:28px;margin-top:6px}.bar i{flex:1;background:var(--accent2);min-height:1px;border-radius:1px}
.cols{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:120px}
.col h3{font-size:12px;margin:4px 6px 10px;color:var(--mut);font-weight:600}
.col[data-c=backlog]{background:#FAF6EF}
.col[data-c=todo]{background:#FCF3D9}
.col[data-c=doing]{background:#E8F0F3}
.col[data-c=review]{background:#FBE9DD}
.col[data-c=done]{background:#E9F3E6}
@media(prefers-color-scheme:dark){
.col[data-c=backlog]{background:#332C22}
.col[data-c=todo]{background:#3D3620}
.col[data-c=doing]{background:#243136}
.col[data-c=review]{background:#3D2C22}
.col[data-c=done]{background:#243024}
}
.col.over{background:#F0E6D0}
.t{cursor:grab;margin-bottom:8px}.t b{display:block;margin-bottom:4px}
select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.p0{border-left:4px solid var(--accent)}.p1{border-left:4px solid var(--accent2)}.p2{border-left:4px solid #D8CBA0}
button{font:inherit;padding:5px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;box-shadow:var(--shadow)}
button:hover{border-color:var(--accent)}
button#add,button[data-run]{background:var(--accent);color:#fff;border-color:var(--accent)}
button#add:hover,button[data-run]:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.t{display:flex;flex-direction:column;gap:4px}
.t .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:2px 9px 2px 7px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.b-running{background:#E8F0F3;color:#4C7A82}.b-exited{background:#E9F3E6;color:#4F7A56}.b-failed{background:#FBE3DE;color:var(--danger)}
.b-error{background:#FBE3DE;color:var(--danger)}.b-stopped{background:#EFE9DE;color:var(--mut)}.b-unknown{background:#F1ECE2;color:var(--mut)}
.iconbtn{padding:2px 8px;font-size:12px;line-height:1.4}
.iconbtn.danger:hover{border-color:var(--danger);color:var(--danger)}
.iconbtn.stop:hover{border-color:var(--danger);color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modalbox{background:var(--card);width:min(760px,100%);max-height:82vh;display:flex;flex-direction:column;border-radius:14px;padding:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.modalhead .mut{font-size:12px}
#logContent{overflow:auto;flex:1;white-space:pre-wrap;word-break:break-all;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--bg);padding:10px;border-radius:8px;margin:0;border:1px solid var(--line)}
.warn{font-size:12px;color:var(--danger)}
.ptag{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.form{display:flex;flex-direction:column;gap:8px}.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.form input,.form textarea{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;overflow:auto}
.plist .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
</style>
<h1>Multi-Agent Workboard <button id=add>+ 新任務</button> <button id=projBtn>📂 專案</button> <button id=notifyBtn>🔔 開啟完成通知</button></h1>
<div class=usage id=usage></div>
<h2>看板</h2><div class=cols id=cols></div>
<div class=modal id=logModal hidden>
  <div class=modalbox>
    <div class=modalhead><b id=logTitle>Log</b><span class=mut id=logMeta></span><button id=logClose>✕ 關閉</button></div>
    <pre id=logContent></pre>
  </div>
</div>
<div class=modal id=taskModal hidden>
  <div class=modalbox>
    <div class=modalhead><b>新任務</b><button id=taskClose>✕ 關閉</button></div>
    <div class=form>
      <label>標題<input id=fTitle></label>
      <label>專案<select id=fProject></select></label>
      <label>目標(goal)<textarea id=fGoal rows=2></textarea></label>
      <label>驗收條件(acceptance,用 ; 分隔)<textarea id=fAcc rows=2></textarea></label>
      <label>會動到的檔案(逗號分隔,可留空)<input id=fFiles placeholder="tools/usage.mjs,web/index.html"></label>
      <div class=row><button id=taskSave data-primary>建立</button></div>
    </div>
  </div>
</div>
<div class=modal id=projModal hidden>
  <div class=modalbox>
    <div class=modalhead><b>專案管理</b><button id=projClose>✕ 關閉</button></div>
    <div class=plist id=projList></div>
    <div class=form>
      <label>id(英數、_、-)<input id=pId></label>
      <label>名稱<input id=pName></label>
      <label>路徑(存在的絕對路徑)<input id=pPath placeholder="D:/MyProject/xxx"></label>
      <div class=row><button id=projSave>新增專案</button></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),api=(p,o)=>fetch('/api/'+p,o).then(r=>r.json());
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n;
const STATUS_LABEL={running:'執行中',exited:'已完成',failed:'失敗',error:'啟動失敗',stopped:'已停止',unknown:'狀態未知',none:'尚未派工過'};
let cfg,tasks=[],projects=[],runStatus={},openLogId=null,userStopping={};
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();
 o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(ctx.currentTime+.15);
 setTimeout(()=>{try{ctx.close()}catch(e){}},300)}catch(e){}}
function notify(title,body){if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
 try{new Notification(title,{body})}catch(e){}beep()}
function updateNotifyBtn(){const b=$('#notifyBtn');if(!b)return;
 if(typeof Notification==='undefined'){b.textContent='此瀏覽器不支援通知';b.disabled=true;return}
 if(Notification.permission==='granted'){b.textContent='🔔 通知已開啟';b.disabled=true}
 else if(Notification.permission==='denied'){b.textContent='🔔 通知已被封鎖';b.disabled=true}
 else{b.textContent='🔔 開啟完成通知';b.disabled=false}}
function checkTaskTransitions(prevStatus){tasks.forEach(t=>{const was=prevStatus[t.id];
 if(was!==undefined&&was!=='review'&&t.status==='review')notify('任務已完成,待確認','『'+t.title+'』已完成,待確認')})}
function checkRunTransitions(prevRun){Object.keys(prevRun).forEach(id=>{const was=prevRun[id],now=runStatus[id]?.status;
 if(was!=='running')return;
 if(userStopping[id]){delete userStopping[id];return}
 const t=tasks.find(x=>x.id===id),title=t?t.title:id;
 if(now==='stopped')notify('任務已停止','『'+title+'』已被手動停止');
 else if(now==='failed'||now==='error')notify('任務失敗','『'+title+'』執行失敗,請查看 log')})}
async function load(){const prevStatus={};tasks.forEach(t=>{prevStatus[t.id]=t.status});
 cfg??=await api('config');projects=await api('projects');tasks=await api('tasks');render();checkTaskTransitions(prevStatus);
 api('usage').then(u=>{$('#usage').innerHTML=u.map(a=>{const mx=Math.max(1,...a.days.map(d=>d.total));
  return `<div class=card><b>${a.label}</b> <span class=mut>${a.id}</span>${a.found?`
  <div class=big>${fmt(a.today)} <span class=mut>今日</span></div>
  <div class=mut>7日 ${fmt(a.week)} · 累計 ${fmt(a.total)}</div>
  <div class=mut>≈ $${a.costToday.toFixed(2)} 今日 · $${a.costWeek.toFixed(2)} 7日 · $${a.costTotal.toFixed(2)} 累計</div>
  <div class=mut>in ${fmt(a.input)} · cache ${fmt(a.cached)} · out ${fmt(a.output)}</div>
  <div class=bar>${a.days.map(d=>`<i title="${d.date}: ${fmt(d.total)}" style="height:${d.total/mx*100}%"></i>`).join('')}</div>`
  :`<div class=mut>${a.enabled===false?'未設定(已停用)':'未設定 / 尚無使用記錄'}</div>`}</div>`}).join('')})}
function badge(t){const r=runStatus[t.id];if(!r||r.status==='none')return '';
 return `<span class="badge b-${r.status}">${STATUS_LABEL[r.status]||r.status}</span>`}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function projLine(t){if(!t.project)return '<div class=warn>⚠ 未綁定專案:會在看板 repo 內執行</div>';
 const p=projects.find(x=>x.id===t.project);
 if(!p)return `<div class=warn>⚠ 專案「${esc(t.project)}」不存在,無法派工</div>`;
 return `<div class=row><span class=ptag>📂 ${esc(p.name||p.id)}</span>${p.valid?'':'<span class=warn>⚠ 路徑失效,無法派工</span>'}</div>`}
function render(){$('#cols').innerHTML=cfg.columns.map(c=>`<div class=col data-c=${c}><h3>${c} (${tasks.filter(t=>t.status==c).length})</h3>${
 tasks.filter(t=>t.status==c).map(t=>`<div class="card t ${t.priority}" draggable=true data-id=${t.id}><b>${t.title}</b>
 <div class=row><select data-id=${t.id}><option value="">未指派</option>${cfg.agents.map(a=>`<option value=${a.id} ${a.id==t.agent?'selected':''}>${a.label}</option>`).join('')}</select>
 <span class=mut>${t.priority}</span> ${badge(t)}</div>
 ${projLine(t)}
 ${t.goal?`<div class=mut>🎯 ${esc(t.goal)}</div>`:''}
 ${t.files?`<div class=mut>📁 ${t.files}</div>`:''}
 <div class=row>${t.agent&&t.status!='done'?`<button data-run=${t.id}>▶ 派工</button>`:''}
 ${runStatus[t.id]?.status==='running'?`<button class="iconbtn stop" data-stop=${t.id}>■ 停止</button>`:''}
 <button class=iconbtn data-log=${t.id}>📜 log</button>
 <button class="iconbtn danger" data-del=${t.id}>🗑 刪除</button></div></div>`).join('')}</div>`).join('')}
const post=b=>api('tasks',{method:'POST',body:JSON.stringify(b)}).then(load);
document.addEventListener('dragstart',e=>e.dataTransfer.setData('id',e.target.dataset?.id||''));
document.addEventListener('dragover',e=>{if(e.target.closest('.col'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(c){e.preventDefault();post({id:e.dataTransfer.getData('id'),status:c.dataset.c})}});
async function fetchLog(id){try{runStatus[id]=await api('tasks/'+id+'/log')}catch(e){runStatus[id]={status:'unknown',content:'讀取失敗: '+e.message,runs:[]}}}
function paintLog(){if(!openLogId)return;const r=runStatus[openLogId];if(!r)return;
 $('#logTitle').textContent='Log: '+openLogId;
 const usageTxt=r.usage?(' · 本次用量: 約 '+(r.usage.total>=1000?(r.usage.total/1000).toFixed(1)+'k':r.usage.total)+' tokens'+(r.usage.costEstimate>0?' · 約 $'+r.usage.costEstimate.toFixed(2)+'(估算)':'')):'';
 $('#logMeta').textContent=`${r.agent?('agent: '+r.agent+' · '):''}狀態: ${STATUS_LABEL[r.status]||r.status}${r.runs&&r.runs.length>1?(' · 共 '+r.runs.length+' 次派工紀錄'):''}${usageTxt}`;
 const pre=$('#logContent');
 pre.textContent=(r.truncated?'...(log 太長,只顯示最後一段)...\n':'')+(r.content||'(尚無輸出)');
 pre.scrollTop=pre.scrollHeight}
async function openLog(id){openLogId=id;$('#logModal').hidden=false;await fetchLog(id);paintLog()}
function closeLog(){openLogId=null;$('#logModal').hidden=true}
async function refreshActive(){const ids=new Set(tasks.filter(t=>t.status==='doing').map(t=>t.id));if(openLogId)ids.add(openLogId);
 if(ids.size===0)return;const prevRun={};ids.forEach(id=>{prevRun[id]=runStatus[id]?.status});
 await Promise.all([...ids].map(fetchLog));checkRunTransitions(prevRun);render();paintLog()}
document.addEventListener('click',async e=>{
 const run=e.target.dataset?.run,stop=e.target.dataset?.stop,logId=e.target.dataset?.log,del=e.target.dataset?.del;
 if(run){const dispatchNow=async force=>{const body=force?{id:run,force:true}:{id:run};const r=await api('dispatch',{method:'POST',body:JSON.stringify(body)});
  if(r.conflict){if(confirm(r.error+'\n\n仍要繼續派工嗎?'))await dispatchNow(true);return}
  if(r.error){alert(r.error)}else{await load();openLog(run)}};
  await dispatchNow(false);return}
 if(stop){if(!confirm('停止這個任務目前的派工行程?'))return;userStopping[stop]=true;const r=await api('tasks/'+stop+'/stop',{method:'POST'});if(r.error)alert(r.error);await load();await refreshActive();return}
 const pdel=e.target.dataset?.pdel;
 if(pdel){if(!confirm('刪除專案「'+pdel+'」?(不會刪除該資料夾;綁定它的任務會變成無法派工)'))return;const r=await api('projects/'+encodeURIComponent(pdel),{method:'DELETE'});if(r.error)alert(r.error);await load();paintProjects();return}
 if(logId){openLog(logId);return}
 if(del){if(!confirm('刪除這張任務?若正在派工中會先停止行程。'))return;const r=await api('tasks/'+del,{method:'DELETE'});if(r.error)alert(r.error);if(openLogId===del)closeLog();await load();return}
});
document.addEventListener('change',e=>{if(e.target.matches('select')&&e.target.dataset.id)post({id:e.target.dataset.id,agent:e.target.value})});
$('#add').onclick=()=>{['#fTitle','#fGoal','#fAcc','#fFiles'].forEach(s=>$(s).value='');
 $('#fProject').innerHTML='<option value="">(不綁定:在看板 repo 內執行)</option>'+projects.map(p=>`<option value="${esc(p.id)}"${p.valid?'':' disabled'}>${esc(p.name||p.id)}${p.valid?'':'(路徑失效)'}</option>`).join('');
 $('#taskModal').hidden=false;$('#fTitle').focus()};
$('#taskClose').onclick=()=>{$('#taskModal').hidden=true};
$('#taskSave').onclick=async()=>{const title=$('#fTitle').value.trim();if(!title){alert('請填標題');return}
 await post({title,project:$('#fProject').value,goal:$('#fGoal').value,acceptance:$('#fAcc').value,files:$('#fFiles').value});$('#taskModal').hidden=true};
function paintProjects(){$('#projList').innerHTML=projects.length?projects.map(p=>`<div class=row><span><b>${esc(p.name||p.id)}</b> <span class=mut>${esc(p.id)} · ${esc(p.path)}</span> ${p.valid?'':'<span class=warn>⚠ 路徑失效</span>'}</span><button class="iconbtn danger" data-pdel="${esc(p.id)}">🗑 刪除</button></div>`).join(''):'<div class=mut>尚無專案</div>'}
$('#projBtn').onclick=()=>{paintProjects();$('#projModal').hidden=false};
$('#projClose').onclick=()=>{$('#projModal').hidden=true};
$('#projSave').onclick=async()=>{const r=await api('projects',{method:'POST',body:JSON.stringify({id:$('#pId').value.trim(),name:$('#pName').value.trim(),path:$('#pPath').value.trim()})});
 if(r.error){alert(r.error);return}['#pId','#pName','#pPath'].forEach(s=>$(s).value='');await load();paintProjects()};
$('#logClose').onclick=closeLog;
$('#notifyBtn').onclick=()=>{if(typeof Notification==='undefined')return;Notification.requestPermission().then(updateNotifyBtn)};
updateNotifyBtn();
load();setInterval(load,15000);setInterval(refreshActive,3000);
</script></html>
